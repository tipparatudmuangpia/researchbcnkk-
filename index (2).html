<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Pathway Navigator — วพบ.ขอนแก่น</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:linear-gradient(135deg,#0f172a 0%,#1a2744 60%,#0f172a 100%);font-family:'Sarabun','Noto Sans Thai',sans-serif;color:#f1f5f9;padding:28px 14px;}
input:focus{outline:none;}
.app{max-width:780px;margin:0 auto;}
/* Header */
.header{text-align:center;margin-bottom:24px;}
.badge-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.25);border-radius:99px;padding:5px 16px;margin-bottom:12px;}
.badge-pill span{color:#a5b4fc;font-size:11px;font-weight:700;letter-spacing:0.07em;}
h1{font-size:24px;font-weight:800;margin-bottom:6px;}
.subtitle{color:#475569;font-size:13px;margin-bottom:14px;}
.level-pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.level-pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.04);border-radius:99px;padding:4px 10px;font-size:11px;}
/* Search */
.search-wrap{position:relative;margin-bottom:18px;}
.search-box{display:flex;align-items:center;background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.12);border-radius:13px;padding:12px 16px;gap:10px;}
.search-box input{flex:1;background:transparent;border:none;color:#f1f5f9;font-size:15px;font-family:'Sarabun',sans-serif;}
.search-box input::placeholder{color:#475569;}
.clear-btn{background:none;border:none;color:#475569;cursor:pointer;font-size:20px;line-height:1;padding:0;}
.dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#1e293b;border:1px solid rgba(255,255,255,0.1);border-radius:12px;overflow:hidden;z-index:99;box-shadow:0 20px 40px rgba(0,0,0,0.5);max-height:300px;overflow-y:auto;display:none;}
.dropdown.open{display:block;}
.drop-item{padding:10px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;justify-content:space-between;align-items:center;transition:background 0.15s;}
.drop-item:hover{background:rgba(99,102,241,0.15);}
.drop-item-name{font-size:14px;}
.drop-item-tags{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap;}
.drop-level-badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700;white-space:nowrap;margin-left:8px;flex-shrink:0;}
/* Profile */
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:22px;margin-bottom:10px;}
.profile-head{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;}
.profile-name{font-size:21px;font-weight:800;margin-bottom:3px;}
.profile-pos{color:#94a3b8;font-size:13px;margin-bottom:2px;}
.profile-deg{color:#64748b;font-size:12px;margin-bottom:8px;}
.tag-wrap{display:flex;flex-wrap:wrap;gap:5px;}
.exp-tag{font-size:11px;padding:3px 9px;border-radius:99px;color:#1e293b;font-weight:700;border:1px solid rgba(0,0,0,0.08);}
.level-badge{display:inline-flex;align-items:center;gap:8px;border-radius:11px;padding:9px 14px;margin-bottom:6px;}
.level-label{font-weight:800;font-size:13px;}
.level-desc{color:#64748b;font-size:11px;}
.level-bar{display:flex;gap:3px;}
.level-bar-seg{height:5px;flex:1;border-radius:3px;}
/* Stats grid */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px;}
.stat-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:11px;padding:12px 8px;text-align:center;}
.stat-val{font-size:24px;font-weight:800;line-height:1.1;}
.stat-lbl{font-size:11px;color:#64748b;margin-top:3px;font-weight:500;}
/* Tabs */
.tabs{display:flex;gap:5px;margin-bottom:10px;background:rgba(255,255,255,0.03);padding:4px;border-radius:11px;border:1px solid rgba(255,255,255,0.06);}
.tab-btn{flex:1;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:600;font-family:'Sarabun',sans-serif;cursor:pointer;border:none;background:transparent;color:#64748b;transition:all 0.2s;}
.tab-btn.active{background:#6366f1;color:#fff;}
/* Tab content */
.tab-content{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:13px;padding:20px;}
.section-title{color:#f1f5f9;font-size:14px;font-weight:700;margin-bottom:14px;}
/* Year bars */
.year-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.year-lbl{color:#334155;font-size:12px;width:34px;text-align:right;flex-shrink:0;}
.year-bar{flex:1;height:24px;background:#0f172a;border-radius:5px;overflow:hidden;display:flex;align-items:center;}
.year-bar-empty{color:#1e293b;font-size:11px;padding-left:8px;}
.year-bar-seg{flex:1;height:100%;border-right:2px solid #0f172a;display:flex;align-items:center;padding-left:6px;}
.year-count{color:#475569;font-size:12px;width:14px;flex-shrink:0;}
/* Pub type badges */
.type-badge{display:inline-block;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:700;}
/* Grants */
.grants-wrap{margin-top:16px;}
.grant-item{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#0f172a;border-radius:8px;margin-bottom:5px;border:1px solid rgba(99,102,241,0.2);}
.grant-item span{color:#c7d2fe;font-size:13px;}
/* Level criteria boxes */
.criteria-box{margin-top:14px;padding:10px 12px;border-radius:8px;}
.criteria-label{font-weight:700;font-size:12px;}
.criteria-text{font-size:12px;}
/* Publications list */
.pub-item{padding:11px 12px;background:#0f172a;border-radius:9px;margin-bottom:6px;border:1px solid rgba(255,255,255,0.04);display:flex;gap:10px;}
.pub-year{color:#334155;font-size:12px;min-width:32px;padding-top:2px;flex-shrink:0;}
.pub-title{color:#cbd5e1;font-size:13px;line-height:1.5;margin-bottom:4px;}
.pub-journal{color:#334155;font-size:11px;margin-bottom:5px;}
.empty-state{text-align:center;padding:30px 20px;}
.empty-icon{font-size:36px;margin-bottom:8px;}
.empty-text{color:#475569;font-size:13px;}
/* Next steps */
.step-item{display:flex;gap:10px;padding:10px 12px;background:rgba(255,255,255,0.02);border-radius:9px;margin-bottom:5px;border:1px solid rgba(255,255,255,0.04);transition:all 0.2s;}
.step-item:hover{background:#0f172a;transform:translateX(3px);}
.step-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
.step-text{color:#cbd5e1;font-size:13px;line-height:1.6;padding-top:1px;}
.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
.rec-box{padding:12px;background:#0f172a;border-radius:10px;border:1px solid rgba(255,255,255,0.05);}
.rec-title{color:#f1f5f9;font-size:12px;font-weight:700;margin-bottom:8px;}
.rec-item{font-size:12px;margin-bottom:4px;padding-left:7px;}
/* Footer */
.footer-note{color:#1e293b;font-size:11px;text-align:center;margin-top:10px;}
/* Empty search state */
.empty-search{text-align:center;padding:36px 20px;}
.empty-search-icon{font-size:48px;margin-bottom:10px;opacity:0.25;}
.quick-btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:20px;}
.quick-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:99px;padding:5px 12px;color:#64748b;font-size:12px;cursor:pointer;font-family:'Sarabun',sans-serif;transition:all 0.2s;}
.quick-btn:hover{background:rgba(99,102,241,0.2);}
</style>
</head>

let selected=null, activeTab="overview";

// ─────────────────────────── INIT ───────────────────────────
document.getElementById("total-text").textContent=`อาจารย์ ${FACULTY.length} คน · พิมพ์ชื่อเพื่อดู Research Profile ส่วนตัว`;

// Level pills
const pillsEl=document.getElementById("level-pills");
LEVELS.forEach(lv=>{
  const cnt=FACULTY.filter(f=>f.level===lv.level).length;
  pillsEl.innerHTML+=`<div class="level-pill" style="border:1px solid ${lv.color}30">
    <span>${lv.icon}</span><span style="color:${lv.color};font-weight:700">${cnt}</span><span style="color:#475569">${lv.label}</span>
  </div>`;
});

// Quick buttons
renderEmptyState();

// ─────────────────────────── SEARCH ───────────────────────────
const searchInput=document.getElementById("search-input");
const clearBtn=document.getElementById("clear-btn");
const dropdown=document.getElementById("dropdown");

searchInput.addEventListener("input",function(){
  const val=this.value.trim();
  clearBtn.style.display=val?"":"none";
  if(!val){selected=null;dropdown.classList.remove("open");renderEmptyState();return;}
  const results=FACULTY.filter(f=>{
    const full=`${f.prefix}${f.first} ${f.last}`;
    return full.includes(val)||f.first.includes(val)||f.last.includes(val);
  });
  renderDropdown(results.slice(0,12));
});

searchInput.addEventListener("focus",function(){
  if(this.value.trim()&&!selected) dropdown.classList.add("open");
});

document.addEventListener("click",function(e){
  if(!e.target.closest(".search-wrap")) dropdown.classList.remove("open");
});

clearBtn.addEventListener("click",function(){
  searchInput.value="";clearBtn.style.display="none";
  selected=null;dropdown.classList.remove("open");renderEmptyState();
});

function renderDropdown(results){
  if(!results.length){dropdown.classList.remove("open");return;}
  dropdown.innerHTML=results.map(f=>`
    <div class="drop-item" data-id="${f.id}">
      <div>
        <div class="drop-item-name">${f.prefix}<b>${f.first}</b> ${f.last}</div>
        <div class="drop-item-tags">${(f.tags||[]).slice(0,3).map(t=>`<span style="font-size:10px;padding:1px 6px;border-radius:99px;background:${tagColor(t)};color:#374151;font-weight:600">${t}</span>`).join("")}</div>
      </div>
      <span class="drop-level-badge" style="color:${LEVELS[f.level-1].color};background:${LEVELS[f.level-1].color}20">${LEVELS[f.level-1].icon} L${f.level}</span>
    </div>
  `).join("");
  dropdown.classList.add("open");
  dropdown.querySelectorAll(".drop-item").forEach(el=>{
    el.addEventListener("click",()=>{
      const f=FACULTY.find(x=>x.id===+el.dataset.id);
      pickFaculty(f);
    });
  });
}

function pickFaculty(f){
  selected=f;activeTab="overview";
  searchInput.value=`${f.prefix}${f.first} ${f.last}`;
  dropdown.classList.remove("open");
  renderProfile();
}

function renderEmptyState(){
  const el=document.getElementById("main-content");
  const quick=FACULTY.slice(0,9).map(f=>`<button class="quick-btn" data-id="${f.id}">${f.prefix}${f.first}</button>`).join("");
  el.innerHTML=`<div class="empty-search">
    <div class="empty-search-icon">🧭</div>
    <p style="color:#1e293b;font-size:14px">ค้นหาชื่ออาจารย์ด้านบน เพื่อดู Research Pathway ส่วนตัว</p>
    <div class="quick-btns">${quick}</div>
  </div>`;
  el.querySelectorAll(".quick-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const f=FACULTY.find(x=>x.id===+btn.dataset.id);
      pickFaculty(f);
    });
  });
}

function renderProfile(){
  if(!selected) return;
  const f=selected, lv=LEVELS[f.level-1];
  const pubs=[...(f.pubs||[])].sort((a,b)=>b.y-a.y);
  const totalPubs=f.tci1+f.tci2+f.scopus;
  const levelBarSegs=LEVELS.map((_,i)=>`<div class="level-bar-seg" style="background:${i<f.level?LEVELS[i].color:'#1e293b'}"></div>`).join("");
  const tags=(f.tags||[]).map(t=>`<span class="exp-tag" style="background:${tagColor(t)}">${t}</span>`).join("");
  const grantsHtml=f.grants.length?`<div class="grants-wrap"><div class="section-title" style="margin-top:16px">💰 ทุนวิจัย</div>${f.grants.map(g=>`<div class="grant-item"><span>🏅</span><span>${g}</span></div>`).join("")}</div>`:"";
  const years=[2567,2566,2565,2564,2563];
  const yearBars=years.map(yr=>{
    const yp=(f.pubs||[]).filter(p=>p.y===yr);
    const segs=yp.length===0?`<span class="year-bar-empty">ไม่มีผลงาน</span>`:
      yp.map(p=>{const s=TYPE_STYLE[p.type]||{bg:"#374151"};return`<div class="year-bar-seg" style="background:${s.bg}" title="${p.t}">${typeBadge(p.type)}</div>`;}).join("");
    return`<div class="year-row"><span class="year-lbl">${yr}</span><div class="year-bar">${segs}</div><span class="year-count">${yp.length||""}</span></div>`;
  }).join("");
  const nextLvlLine=f.level<5?`<div class="criteria-box" style="background:rgba(255,255,255,0.02);border:1px dashed rgba(255,255,255,0.07);margin-top:8px"><span class="criteria-label" style="color:#475569">🎯 เกณฑ์ L${f.level+1}: </span><span class="criteria-text" style="color:#334155">${LEVELS[f.level].criteria}</span></div>`:"";

  const el=document.getElementById("main-content");
  el.innerHTML=`
    <!-- Header card -->
    <div class="card">
      <div class="profile-head">
        <div style="flex:1;min-width:180px">
          <div class="profile-name">${f.prefix}${f.first} ${f.last}</div>
          <div class="profile-pos">${f.pos}</div>
          <div class="profile-deg">🎓 ${f.deg}</div>
          <div class="tag-wrap">${tags}</div>
        </div>
        <div>
          <div class="level-badge" style="background:${lv.bg};border:1.5px solid ${lv.color}30">
            <span style="font-size:18px">${lv.icon}</span>
            <div>
              <div class="level-label" style="color:${lv.color}">Level ${f.level} — ${lv.label}</div>
              <div class="level-desc">${lv.desc}</div>
            </div>
          </div>
          <div class="level-bar">${levelBarSegs}</div>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-val" style="color:#1d4ed8">${f.tci1}</div><div class="stat-lbl">TCI Tier 1</div></div>
      <div class="stat-card"><div class="stat-val" style="color:#b45309">${f.tci2}</div><div class="stat-lbl">TCI Tier 2</div></div>
      <div class="stat-card"><div class="stat-val" style="color:#7c3aed">${f.scopus}</div><div class="stat-lbl">Scopus</div></div>
      <div class="stat-card"><div class="stat-val" style="color:#059669">${f.q1}</div><div class="stat-lbl">Q1</div></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn ${activeTab==='overview'?'active':''}" data-tab="overview">📊 ภาพรวม</button>
      <button class="tab-btn ${activeTab==='publications'?'active':''}" data-tab="publications">📄 ผลงาน (${totalPubs})</button>
      <button class="tab-btn ${activeTab==='nextsteps'?'active':''}" data-tab="nextsteps">🎯 Next Steps</button>
    </div>

    <!-- Tab content -->
    <div class="tab-content" id="tab-body"></div>
    <p class="footer-note">ข้อมูลจากฐานข้อมูลผลงานวิจัย วพบ.ขอนแก่น ปีการศึกษา 2563–2567</p>
  `;

  // Tab buttons
  el.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      activeTab=btn.dataset.tab;
      el.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      renderTabBody(f,lv,pubs,yearBars,grantsHtml,nextLvlLine);
    });
  });

  renderTabBody(f,lv,pubs,yearBars,grantsHtml,nextLvlLine);
}

function renderTabBody(f,lv,pubs,yearBars,grantsHtml,nextLvlLine){
  const tb=document.getElementById("tab-body");
  if(!tb) return;

  if(activeTab==="overview"){
    tb.innerHTML=`
      <div class="section-title">📈 ผลงานตีพิมพ์ 5 ปีย้อนหลัง (2563–2567)</div>
      ${yearBars}
      ${grantsHtml}
      <div class="criteria-box" style="background:${lv.color}15;border:1px solid ${lv.color}20;margin-top:14px">
        <span class="criteria-label" style="color:${lv.color}">✅ เกณฑ์ L${f.level}: </span>
        <span class="criteria-text" style="color:#94a3b8">${lv.criteria}</span>
      </div>
      ${nextLvlLine}
    `;
  } else if(activeTab==="publications"){
    const pubsHtml=pubs.length===0?`<div class="empty-state"><div class="empty-icon">📝</div><p class="empty-text">ยังไม่มีผลงานตีพิมพ์<br>เริ่มต้นจาก TCI Tier 2 ก่อนได้เลยค่ะ</p></div>`:
      pubs.map(p=>`<div class="pub-item">
        <span class="pub-year">${p.y}</span>
        <div style="flex:1"><div class="pub-title">${p.t}</div><div class="pub-journal">${p.j}</div>${typeBadge(p.type)}</div>
      </div>`).join("");
    tb.innerHTML=`<div class="section-title">📄 รายการผลงานตีพิมพ์</div>${pubsHtml}`;
  } else {
    const steps=lv.nextSteps.map((s,i)=>`
      <div class="step-item">
        <div class="step-num" style="background:${lv.color}20;border:1.5px solid ${lv.color};color:${lv.color}">${i+1}</div>
        <span class="step-text">${s}</span>
      </div>`).join("");
    const nextLbl=f.level<5?`L${f.level+1} ${LEVELS[f.level].label}`:"ผู้นำวิจัยระดับโลก";
    const jList=lv.journals.map(j=>`<div class="rec-item" style="color:#64748b;border-left:2px solid ${lv.color}">${j}</div>`).join("");
    const fList=lv.funding.map(fn=>`<div class="rec-item" style="color:#64748b;border-left:2px solid ${lv.color}">${fn}</div>`).join("");
    tb.innerHTML=`
      <div class="section-title">🎯 Next Steps แนะนำ</div>
      <p style="color:#475569;font-size:12px;margin-bottom:14px">L${f.level} ${lv.label} → ${nextLbl}</p>
      ${steps}
      <div class="rec-grid" style="margin-top:14px">
        <div class="rec-box"><div class="rec-title">📰 วารสารที่แนะนำ</div>${jList}</div>
        <div class="rec-box"><div class="rec-title">💰 แหล่งทุน</div>${fList}</div>
      </div>
    `;
  }
}
</script>
</body>
</html>
